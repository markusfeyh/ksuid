name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        otp: ['27', '28', '29']
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.28'
      - run: rebar3 compile
      - run: rebar3 eunit
      - run: rebar3 xref
      - run: rebar3 dialyzer
